    function normalizeNode(item) {
      if (item.type === "folder") {
        return {
          ...item,
          children: (item.children || []).map(normalizeNode)
        };
      }
      return { type: "game", base: "jsdelivr", ...item };
    }

    const rootNode = { 
      type: "folder", 
      name: "root", 
      children: itemsDB.map(normalizeNode) 
    };

    let activeCategoryName = "HTML Games";
    let currentFolder = rootNode.children.find(f => f.name === activeCategoryName) || rootNode;
    let currentPath = [rootNode, currentFolder];

    async function resolveGameImage(game) {
      const base = "https://raw.githubusercontent.com/ioB-ybbolB/ioB-ybbolB.github.io/refs/heads/main/assets/";
      const targetName = game.path ? game.path : game.repo;
      const candidates = [
        `${base}${targetName}.png`,
        `${base}${targetName}.webp`,
        `${base}${targetName}.jpg`
      ];
      return new Promise(resolve => {
        const img = new Image();
        let i = 0;
        const tryNext = () => {
          if (i >= candidates.length) {
            resolve(null);
            return;
          }
          img.src = candidates[i++];
        };
        img.onload = () => resolve(img.src);
        img.onerror = tryNext;
        tryNext();
      });
    }

    function isFolder(node) {
      return !!node && node.type === "folder";
    }

    function isGame(node) {
      return !!node && node.type === "game";
    }

    function getCurrentSearchScope() {
      return currentPath.length > 1 ? currentPath[1] : rootNode;
    }

    function syncSidebarSelection() {
      const map = {
        "HTML Games": "jsGamesBtn",
        "Emulator Games": "emulatedGamesBtn",
        "Apps": "appsBtn",
        "Movies": "moviesBtn"
      };

      document.querySelectorAll(".sidebar button").forEach(btn => btn.classList.remove("selected"));
      if (activeCategoryName && map[activeCategoryName]) {
        const selected = document.getElementById(map[activeCategoryName]);
        if (selected) selected.classList.add("selected");
      }
    }

    function getPathText() {
      return currentPath.map(node => node.name).join(" / ");
    }

    function updateFooter() {
      const footer = document.getElementById("folderLocation");
      const backBtn = document.getElementById("folderBackBtn");
      if (footer) footer.textContent = getPathText();
      if (backBtn) backBtn.disabled = currentPath.length <= 1;
    }

    function clearSearchBox() {
      const input = document.getElementById("gameSearch");
      if (input) input.value = "";
    }

      const folder = rootNode.children.find(f => f.name === name);

      activeCategoryName = name;
      currentFolder = folder;
      currentPath = [rootNode, currentFolder];

      clearSearchBox();

    function enterFolder(folder) {
      if (!isFolder(folder)) return;
      if (currentPath[currentPath.length - 1] !== folder) {
        currentPath.push(folder);
      }
      currentFolder = folder;

      if (currentPath.length > 1) {
        activeCategoryName = currentPath[1].name;
      } else {
        activeCategoryName = null;
      }

      syncSidebarSelection();
      clearSearchBox();
      renderCurrentView();
    }

    function goBack() {
      if (currentPath.length <= 1) return;

      currentPath.pop();
      currentFolder = currentPath[currentPath.length - 1] || rootNode;

      if (currentFolder === rootNode) {
        activeCategoryName = null;
      } else if (currentPath.length > 1) {
        activeCategoryName = currentPath[1].name;
      }

      syncSidebarSelection();
      clearSearchBox();
      renderCurrentView();
    }

    function nodeText(node) {
      return [node.name, node.owner, node.repo, node.path].filter(Boolean).join(" ").toLowerCase();
    }

    function collectMatches(node, query, results = []) {
      if (node !== rootNode && isGame(node) && nodeText(node).includes(query)) {
        results.push(node);
      }
      if (isFolder(node)) {
        for (const child of (node.children || [])) {
          collectMatches(child, query, results);
        }
      }
      return results;
    }

    function getDescendantGames(node, results = []) {
      if (isGame(node)) {
        results.push(node);
      } else if (isFolder(node)) {
        for (const child of (node.children || [])) {
          getDescendantGames(child, results);
        }
      }
      return results;
    }

    async function applyFolderPreview(button, folder) {
      const fallback = GAME_IMAGE_FALLBACK;
      const previewGames = getDescendantGames(folder);
      
      const uniqueUrls = [];
      for (const game of previewGames) {
        try {
          const url = await resolveGameImage(game);
          const finalUrl = url || fallback;
          if (!uniqueUrls.includes(finalUrl)) {
            uniqueUrls.push(finalUrl);
          }
        } catch (e) {}
        if (uniqueUrls.length >= 4) break;
      }
    
      if (uniqueUrls.length === 0) {
        uniqueUrls.push(fallback);
      }
    
      button.style.backgroundImage = '';
    
      let previewGrid = button.querySelector('.folder-preview-grid');
      if (!previewGrid) {
        previewGrid = document.createElement('div');
        previewGrid.className = 'folder-preview-grid';
        button.style.position = 'relative';
        button.style.zIndex = '0';
        
        button.prepend(previewGrid);
      }
      
      previewGrid.innerHTML = '';
    
      Object.assign(previewGrid.style, {
        position: 'absolute',
        top: '0',
        left: '0',
        width: '100%',
        height: '100%',
        display: 'grid',
        overflow: 'hidden',
        zIndex: '-1',
        pointerEvents: 'none',
        gridTemplateColumns: '1fr 1fr',
        gridTemplateRows: '1fr 1fr'
      });
    
      const overlay = document.createElement('div');
      Object.assign(overlay.style, {
        position: 'absolute',
        top: '0',
        left: '0',
        width: '100%',
        height: '100%',
        backgroundColor: 'rgba(0, 0, 0, 0.42)',
        zIndex: '1'
      });
      previewGrid.appendChild(overlay);
    
      uniqueUrls.forEach((url, index) => {
        const img = document.createElement('img');
        img.src = url;
        Object.assign(img.style, {
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          zIndex: '0'
        });
    
        if (uniqueUrls.length === 1) {
          img.style.gridColumn = '1 / span 2';
          img.style.gridRow = '1 / span 2';
        } else if (uniqueUrls.length === 2) {
          img.style.gridRow = '1 / span 2';
          img.style.gridColumn = index === 0 ? '1' : '2';
        } else if (uniqueUrls.length === 3) {
          if (index === 0) {
            img.style.gridColumn = '1';
            img.style.gridRow = '1 / span 2';
          } else if (index === 1) {
            img.style.gridColumn = '2';
            img.style.gridRow = '1';
          } else {
            img.style.gridColumn = '2';
            img.style.gridRow = '2';
          }
        } else {
          img.style.gridColumn = (index % 2 === 0) ? '1' : '2';
          img.style.gridRow = (index < 2) ? '1' : '2';
        }
    
        previewGrid.appendChild(img);
      });
    }

    async function renderNodes(nodes) {
      const container = document.getElementById("gameContainer");
      container.innerHTML = "";

      if (!nodes.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No results found.";
        container.appendChild(empty);
        updateFooter();
        return;
      }

      for (const node of nodes) {
        const wrapper = document.createElement("div");
        wrapper.className = "card-wrapper";

        const btn = document.createElement("button");
        btn.className = "rounded-button" + (isFolder(node) ? " folder-button" : "");
        btn.title = node.name;

        if (isFolder(node)) {
          const icon = document.createElement("div");
          icon.className = "folder-icon";
          icon.textContent = "📁";
          btn.appendChild(icon);
          applyFolderPreview(btn, node);
          btn.onclick = () => enterFolder(node);
        } else {
          resolveGameImage(node).then(url => {
            btn.style.backgroundImage = `url('${url || GAME_IMAGE_FALLBACK}')`;
          });
          btn.onclick = () => loadGame(node.owner, node.repo, node.name, node.base, node.path);
        }

        const label = document.createElement("div");
        label.className = "button-text";
        label.textContent = node.name;

        wrapper.appendChild(btn);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      }

      updateFooter();
    }

    async function renderCurrentView() {
      const query = document.getElementById("gameSearch").value.trim().toLowerCase();
      if (query) {
        const scope = getCurrentSearchScope();
        const results = collectMatches(scope, query);
        await renderNodes(results);
      } else {
        await renderNodes((currentFolder.children || []));
      }
    }

    function filterGames() {
      renderCurrentView();
    }

    document.getElementById("folderBackBtn").onclick = goBack;
    document.getElementById("gameSearch").addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        clearSearchBox();
        renderCurrentView();
      }
    });

    document.getElementById("jsGamesBtn").onclick = () => showTopLevelFolder("HTML Games");
    document.getElementById("emulatedGamesBtn").onclick = () => showTopLevelFolder("Emulator Games");
    document.getElementById("appsBtn").onclick = () => showTopLevelFolder("Apps");
    document.getElementById("moviesBtn").onclick = () => showTopLevelFolder("Movies");

    showTopLevelFolder("HTML Games");
  </script>

  <script>
    const BRANCHES = ["main", "gh-pages", "master", "latest"];

    async function resolveBranch(owner, repo, path = "") {
      let subDir = path ? path.replace(/^\/+/, '').replace(/\/?$/, '/') : '';

      for (const b of BRANCHES) {
        const test = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${b}/${subDir}index.html`;
        try {
          const r = await fetch(test, { method: "HEAD" });
          if (r.ok) return b;
        } catch (e) {}
      }
      return "latest2";
    }

    async function getLatestCommit(owner, repo, path = "") {
      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?per_page=1`);
        if (!response.ok) {
          throw new Error(`Failed to fetch commit for ${owner}/${repo}`);
        }
        const data = await response.json();
        return data[0].sha;
      } catch (error) {
        console.warn("GitHub API error:", error);
        return await resolveBranch(owner, repo, path);
      }
    }

    function rewriteLargeAssets(html, owner, repo, ref) {
      return html.replace(/(src|href)=["']([^"']+?\.(wasm|data|unityweb))["']/gi,
      (m, a, path) => {
        if(/https?:/i.test(path)) return m;
        const raw = `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/` + path.replace(/^\/+/, "");
        return `${a}="${raw}"`;
      });
    }

    function rewriteNavigation(html) {
      html = html.replace(/<a([^>]*?)href=["']([^"']+)["']([^>]*)>/gi,
      (m, a, href, b) => {
        if(/^(https?:|#|mailto)/i.test(href)) return m;
        return `<a${a}href="#" onclick="__navigate('${href}');return false;"${b}>`;
      });
      html = html.replace(/window\.location\.href\s*=\s*["']([^"']+)["']/gi,
      (m, url) => `__navigate('${url}')`);
      html = html.replace(/location\.href\s*=\s*["']([^"']+)["']/gi,
      (m, url) => `__navigate('${url}')`);
      return html;
    }

    function injectCore(html, base, gameName) {
      html = rewriteNavigation(html);
      html = html.replace(/^\s*<!DOCTYPE[^>]*>/i, '');

      const hasBase = /<base\s+href=/i.test(html);
      
      const core = `${hasBase ? '' : `<base href="${base}">`}
<title>${gameName}</title>
<script>
function __navigate(p){
    if(!p.startsWith("http")) p = new URL(p, document.baseURI).href;
    window.opener.__dynamicFetch(window, p, "${gameName}");
}
<\/script>`;

      if (/<head/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, m => m + '\n' + core);
        return '<!DOCTYPE html>\n' + html.trim();
      } else if (/<html/i.test(html)) {
        html = html.replace(/<html[^>]*>/i, m => m + '\n' + core);
        return '<!DOCTYPE html>\n' + html.trim();
      } else {
        return `<!DOCTYPE html>
<html>
<head>
${core}
</head>
<body>
${html.trim()}
</body>
</html>`;
      }
    }

    async function __dynamicFetch(tab, url, gameName) {
      const res = await fetch(url);
      let html = await res.text();
      const base = url.substring(0, url.lastIndexOf("/") + 1);
      
      html = injectCore(html, base, gameName); 
      
      tab.document.open();
      tab.document.write(html);
      tab.document.close();
    }

    async function loadGame(owner, repo, name, baseProvider = "jsdelivr", path = "") {
      const tab = window.open("about:blank", "_blank");
      if (!tab) return;
      const icon = tab.document.createElement("link");
      icon.rel = "icon";
      icon.href = "https://raw.githubusercontent.com/ioB-ybbolB/ioB-ybbolB.github.io/main/favicon.png";
      tab.document.head.appendChild(icon);

      tab.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>Loading ${name}...</title>
            <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
            <style>
              body {
                margin: 0;
                background: radial-gradient(circle at center, #000010, #000);
                color: #0ff;
                font-family: 'Orbitron', sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                overflow: hidden;
              }
              
              .spinner {
                width: 60px;
                height: 60px;
                border: 6px solid rgba(0, 255, 255, 0.1);
                border-top: 6px solid #0ff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 25px;
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
              }

              @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
              }

              .loading-text {
                font-size: 1.5em;
                letter-spacing: 3px;
                text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
                animation: pulse 1.5s ease-in-out infinite;
                user-select: none;
              }

              @keyframes pulse {
                0%, 100% { opacity: 1; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
                50% { opacity: 0.6; text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }
              }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <div class="loading-text">Loading ${name}...</div>
          </body>
        </html>
      `);

      const ref = await getLatestCommit(owner, repo, path);
      let subDir = path ? path.replace(/^\/+/, '').replace(/\/?$/, '/') : '';

      let base, index;
      if (baseProvider === "raw") {
        base = `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${subDir}`;
        index = `${base}index.html`;
      } else {
        base = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${subDir}`;
        index = `${base}index.html`;
      }

      const res = await fetch(index);
      let html = await res.text();
      
      html = rewriteLargeAssets(html, owner, repo, ref);
      html = injectCore(html, base, name);

      tab.document.open();
      tab.document.write(html);
      tab.document.close();
    }
  </script>

  <div style="pointer-events:none; user-select:none;">
    <script type="text/javascript" src="https://counter.websiteout.com/js/2/6/0/0"></script>
